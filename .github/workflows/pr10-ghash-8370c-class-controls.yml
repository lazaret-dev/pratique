name: Manual reviewed Linux and Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr10-linux-windows-validation
  cancel-in-progress: false

jobs:
  linux:
    if: github.ref == 'refs/heads/codex/pr10-linux-windows-validation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-msrv
            toolchain: 1.87.0
            rustflags: --cfg pratique_portable -C target-feature=-aes,-pclmulqdq
            job_minutes: 40
            driver_minutes: 29
          - lane: linux-stable
            toolchain: stable
            rustflags: ''
            job_minutes: 30
            driver_minutes: 21
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_minutes }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      PRATIQUE_TIMING_SECS: '3'
    steps:
      - name: Initialize retained invocation metadata
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pratique-release-validation"
          python3 - <<'PY'
          import json, os, pathlib
          fields = ['GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion']
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pratique-release-validation/bootstrap.json'
          p.write_text(json.dumps({k: os.environ.get(k) for k in fields}, indent=2) + '\n')
          PY
      - name: Checkout reviewed administrative branch head
        id: admin
        timeout-minutes: 1
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fuzz/corpus/
      - name: Checkout immutable reviewed candidate
        id: candidate
        timeout-minutes: 1
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: c6377a42e8e30131692e305ca8e016d78def19f0
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fuzz/corpus/
      - name: Install declared Rust toolchain without dependency installers
        id: install
        timeout-minutes: 2
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal > "$RUNNER_TEMP/pratique-release-validation/toolchain-install.stdout.log" 2> "$RUNNER_TEMP/pratique-release-validation/toolchain-install.stderr.log"
      - name: Retain every fixed Linux check and package result without retry
        if: always() && steps.admin.outcome == 'success' && steps.candidate.outcome == 'success' && steps.install.outcome == 'success'
        timeout-minutes: ${{ matrix.driver_minutes }}
        shell: bash
        run: python3 -B admin/cleanroom/ghash_integration/linux_windows_validation/run_validation.py ${{ matrix.lane }}
      - name: Upload full Linux stdout stderr identities and source crate
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr10-validation-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pratique-release-validation
          if-no-files-found: error
          retention-days: 14

  windows:
    if: github.ref == 'refs/heads/codex/pr10-linux-windows-validation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: windows-arm64
            runner: windows-11-arm
            toolchain: 1.97.0-aarch64-pc-windows-msvc
          - lane: windows-x64
            runner: windows-2025
            toolchain: 1.97.0-x86_64-pc-windows-msvc
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: ''
      PRATIQUE_TIMING_SECS: '3'
    steps:
      - name: Initialize retained invocation metadata
        timeout-minutes: 1
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pratique-release-validation'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $fields = 'GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion'
          $record = @{}
          foreach ($key in $fields) { $record[$key] = [Environment]::GetEnvironmentVariable($key) }
          $record | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'bootstrap.json')
      - name: Checkout reviewed administrative branch head
        id: admin
        timeout-minutes: 1
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: admin
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fuzz/corpus/
      - name: Checkout immutable reviewed candidate
        id: candidate
        timeout-minutes: 1
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: c6377a42e8e30131692e305ca8e016d78def19f0
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fuzz/corpus/
      - name: Checkout immutable original baseline in separate source and target directory
        id: baseline
        timeout-minutes: 1
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: a29c72ffbf7bfcade5b99f04f1414f77ac31a8cf
          path: baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fuzz/corpus/
      - name: Install exact native Rust host toolchain
        id: install
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pratique-release-validation'
          & rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal > (Join-Path $out 'toolchain-install.stdout.log') 2> (Join-Path $out 'toolchain-install.stderr.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain baseline HRR candidate HRR and full candidate release without retry
        if: always() && steps.admin.outcome == 'success' && steps.candidate.outcome == 'success' && steps.install.outcome == 'success'
        timeout-minutes: 28
        shell: pwsh
        run: |
          & python -B admin/cleanroom/ghash_integration/linux_windows_validation/run_validation.py ${{ matrix.lane }}
          exit $LASTEXITCODE
      - name: Upload full Windows stdout stderr PE identities and failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr10-validation-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pratique-release-validation
          if-no-files-found: error
          retention-days: 14
