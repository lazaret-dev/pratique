name: PR10 bounded matched batch investigation

on:
  push:
    branches: [codex/pr10-ghash-timing-diagnostics]

permissions:
  contents: read
  actions: read

jobs:
  build-batch-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.87.0
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact compiler
        timeout-minutes: 2
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Build owned batch controls and actual linked evidence
        timeout-minutes: 12
        env:
          PRATIQUE_BATCH_BUILD_OUTPUT: ${{ runner.temp }}/batch-companion-build
        run: python3 cleanroom/ghash_integration/timing_diagnostics/build_batch_companion.py
      - name: Preserve companion and actual runtime disassembly
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr10-matched-batch-companion
          path: ${{ runner.temp }}/batch-companion-build
          retention-days: 14
          compression-level: 6
          if-no-files-found: error

  bounded-default-batch-protocol:
    needs: build-batch-companion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      PRATIQUE_BATCH_REPLICA: ${{ matrix.replica }}
      PRATIQUE_TIMING_SECS: '3'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Download and verify sealed normal and owned companion
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PRATIQUE_BATCH_COMPANION_DIGEST: ${{ needs.build-batch-companion.outputs.artifact_digest }}
          PRATIQUE_BATCH_COMPANION_ARTIFACT: ${{ needs.build-batch-companion.outputs.artifact_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/batch-output"
          gh api repos/lazaret-dev/pratique/actions/artifacts/13657075157/zip > "$RUNNER_TEMP/phase1.zip"
          gh api "repos/lazaret-dev/pratique/actions/artifacts/$PRATIQUE_BATCH_COMPANION_ARTIFACT/zip" > "$RUNNER_TEMP/batch-companion.zip"
          python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py prepare
      - name: One sealed e2dd preflight on selected live core
        timeout-minutes: 3
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py preflight
      - name: DATA triplet only after corresponding confirmed preflight failure
        timeout-minutes: 4
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py DATA
      - name: Prepared H triplet only after corresponding confirmed preflight failure
        timeout-minutes: 4
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py KEY
      - name: One sealed post-window check with no retroactive controls
        if: always()
        timeout-minutes: 3
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py postflight
      - name: Reconstruct complete and partial raw samples
        if: always()
        timeout-minutes: 5
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_batch.py report
      - name: Preserve every host, failure, skipped reason and raw sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr10-matched-batch-replica-${{ matrix.replica }}
          path: ${{ runner.temp }}/batch-output
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
