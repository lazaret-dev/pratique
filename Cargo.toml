[package]
name = "pratique"
version = "0.1.0"
edition = "2021"
description = "A from-scratch HTTPS client for Rust with zero dependencies: TLS 1.3 (and 1.2), X.509 validation and HTTP/1.1, std only"
license = "Apache-2.0"
repository = "https://github.com/lazaret-dev/pratique"
exclude = ["fuzz/", "target*/", "tools/"]

[dependencies]

[features]
default = ["net"]
# TLS, the HTTP client, sockets, OS randomness, the SIMD kernels and zeroizing of secrets: everything
# that does I/O or needs `unsafe`. Without it (`default-features = false`) the crate is the pure
# verification part (ASN.1, PEM, X.509 path validation, revocation checking, SHA-1/2, HMAC, RSA, ECDSA
# and Ed25519 verification, signed notes, Merkle proofs, the Go checksum database check and decompression):
# `#![forbid(unsafe_code)]`, no I/O, no threads, builds for wasm32. See "Features" in the README and
# tools/check_features.sh.
net = []
# A TLS 1.3 SERVER (`tls::server`) and a certificate writer for tests (`tls::pki`), with an HTTP/1.1 and HTTP/2 server
# on top. Being made ready for production (BACKLOG B-109 to B-114): its signing is constant time (B-109; the keys and
# signing themselves, `pratique::sign`, are in `net`), but it is not for production yet. Off by default, so the default
# build contains no server. See src/tls/server.rs.
server = ["net"]
# Mozilla's root store for TLS servers, built in (`mozilla_roots::trust_store()`; roots/mozilla.pem, about 190 KB, made by
# tools/gen_mozilla_roots.py from NSS's certdata.txt, and like NSS under the Mozilla Public License 2.0: see NOTICE): for
# machines whose own CA bundle is missing or old. Pure: it adds no I/O and works with or without `net`. Off by default;
# see src/mozilla_roots.rs.
mozilla-roots = []

[[example]]
name = "acme_serve"
required-features = ["server"]

[[example]]
name = "async_get"
required-features = ["net"]

[[example]]
name = "bench"
required-features = ["net"]

[[example]]
name = "bench_net"
required-features = ["server"]

[[example]]
name = "cms_verify"
required-features = ["net"]

[[example]]
name = "fetch"
required-features = ["net"]

[[example]]
name = "field_check"
required-features = ["net"]

[[example]]
name = "quic_probe"
required-features = ["net"]

[[example]]
name = "native_roots"
required-features = ["net"]

[[example]]
name = "probe"
required-features = ["net"]

[[example]]
name = "scan_proxy"
required-features = ["server"]

[[example]]
name = "serve"
required-features = ["server"]

[[example]]
name = "sumdb"
required-features = ["net"]

[[example]]
name = "tuf_refresh"
required-features = ["net"]

[[test]]
name = "interop_openssl"
required-features = ["net"]

[[test]]
name = "system_roots"
required-features = ["net"]

[[test]]
name = "native_roots"
required-features = ["net"]

[[test]]
name = "mozilla_roots"
required-features = ["mozilla-roots"]

[[test]]
name = "h2_client_interop"
required-features = ["net"]

[[test]]
name = "h3_client_interop"
required-features = ["net"]

[lints.rust]
# `--cfg pratique_portable` forces the portable (non-SIMD) ChaCha20 path; see src/crypto/chacha20poly1305.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pratique_portable)', 'cfg(pratique_fuzzing)'] }

[profile.release]
opt-level = 3
debug = false

[profile.test]
opt-level = 2
