name: PR10 bounded H preparation investigation

on:
  push:
    branches: [codex/pr10-ghash-timing-diagnostics]

permissions:
  contents: read
  actions: read

jobs:
  build-h-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.87.0
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact control compiler
        timeout-minutes: 2
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Build owned-source H controls and actual linked evidence
        timeout-minutes: 12
        env:
          PRATIQUE_H_BUILD_OUTPUT: ${{ runner.temp }}/h-companion-build
        run: python3 cleanroom/ghash_integration/timing_diagnostics/build_h_companion.py
      - name: Preserve companion and actual runtime disassembly
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr10-h-preparation-companion
          path: ${{ runner.temp }}/h-companion-build
          retention-days: 14
          compression-level: 6
          if-no-files-found: error

  bounded-default-h-protocol:
    needs: build-h-companion
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      PRATIQUE_H_REPLICA: ${{ matrix.replica }}
      PRATIQUE_TIMING_SECS: '3'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Download and verify sealed binaries and owned companion
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PRATIQUE_H_COMPANION_DIGEST: ${{ needs.build-h-companion.outputs.artifact_digest }}
          PRATIQUE_H_COMPANION_ARTIFACT: ${{ needs.build-h-companion.outputs.artifact_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/h-output"
          gh api repos/lazaret-dev/pratique/actions/artifacts/13657075157/zip > "$RUNNER_TEMP/phase1.zip"
          gh api "repos/lazaret-dev/pratique/actions/artifacts/$PRATIQUE_H_COMPANION_ARTIFACT/zip" > "$RUNNER_TEMP/h-companion.zip"
          python3 cleanroom/ghash_integration/timing_diagnostics/run_h.py prepare
      - name: Preserve all three unpinned true-default normal gates
        timeout-minutes: 3
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_h.py startup
      - name: Preserve all three pinned true-default normal gates
        timeout-minutes: 3
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_h.py pinned
      - name: H reference rows one through seven and matched controls
        timeout-minutes: 5
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_h.py controls
      - name: Reconstruct complete and partial recorded samples
        if: always()
        timeout-minutes: 4
        run: python3 cleanroom/ghash_integration/timing_diagnostics/run_h.py report
      - name: Preserve every host outcome and raw H sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr10-h-preparation-replica-${{ matrix.replica }}
          path: ${{ runner.temp }}/h-output
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
